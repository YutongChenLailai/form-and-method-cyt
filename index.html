<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form and Method CYT</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#262626;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}header{position:fixed;z-index:4;top:0;left:0;right:0;padding:26px 34px;background:linear-gradient(#fff 75%,#ffffff00);display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:17px;font-weight:500;margin:0;letter-spacing:.03em}.eyebrow{font-size:10px;letter-spacing:.19em;color:#777;margin-bottom:8px}.subtitle{font-size:11px;color:#777;margin-top:7px}nav{display:flex;gap:8px;align-items:center}button,input{border:1px solid #e4e4e4;border-radius:24px;background:#fff;padding:10px 15px}button:hover{background:#f4f4f4}input{width:170px;outline:none}input:focus,button:focus-visible{outline:2px solid #666;outline-offset:3px}#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}#viewport:active{cursor:grabbing}#world{position:absolute;width:1800px;height:1320px;transform-origin:0 0}svg{position:absolute;inset:0;width:1800px;height:1320px;pointer-events:none}path{fill:none;stroke:#bdbdbd;stroke-width:1.2;stroke-dasharray:3 7;stroke-linecap:round}.node{position:absolute;transform:translate(-50%,-50%);width:174px;min-height:70px;border:1px solid #e5e5e5;border-radius:30px;padding:15px 18px;background:#fff;text-align:left;transition:opacity .2s,box-shadow .2s,border .2s}.node:hover{background:#fafafa;border-color:#aaa;box-shadow:0 6px 25px #00000008}.node strong{font-size:13px;font-weight:500;display:block}.node span{display:block;font-size:10px;line-height:1.5;color:#777;margin-top:5px}.node.group{width:192px;background:#f6f6f6;border-color:#dedede}.node.center{width:240px;padding:27px 25px;border-radius:48px;background:#292929;color:white;border:0}.node.center strong{font:26px Georgia,serif}.node.center span{color:#ccc;font-size:11px}.node.dim{opacity:.18}.node.selected{border-color:#444}footer{position:fixed;bottom:24px;left:34px;right:34px;display:flex;justify-content:space-between;pointer-events:none;color:#888;font-size:11px;line-height:1.8}.controls{position:fixed;bottom:60px;right:30px;display:flex;gap:6px}.controls button{width:40px;height:40px;padding:0}dialog{border:1px solid #e2e2e2;border-radius:30px;padding:34px;width:min(500px,calc(100% - 32px));max-height:85vh;color:#333;box-shadow:0 20px 100px #00000013}dialog::backdrop{background:#ffffffb8;backdrop-filter:blur(5px)}dialog h2{font-size:23px;font-weight:500;margin:24px 0 8px}dialog p{font-size:14px;line-height:1.95}dialog .english{color:#777;font-size:13px}dialog .close{float:right;padding:6px 12px}.tag{font-size:10px;letter-spacing:.1em;color:#888}#empty{display:none;position:fixed;top:110px;right:35px;background:white;padding:12px;border-radius:20px;color:#777}@media(max-width:650px){header{padding:20px;align-items:flex-start}h1{font-size:14px}nav{flex-wrap:wrap;justify-content:flex-end;max-width:160px}nav input{width:145px}nav button{padding:7px 10px;font-size:11px}.subtitle{max-width:185px;line-height:1.5}footer{left:20px;right:20px;font-size:10px}footer span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div><div class="eyebrow">CYT / RESEARCH ATLAS · 01</div><h1>Form and Method</h1><div class="subtitle">碎片化记忆、生成式系统与人的解释权</div></div><nav aria-label="地图工具"><input id="search" aria-label="搜索中英文关键词" placeholder="搜索 / Find a thought"><button id="reset">全览 ↗</button><button id="about">阅读说明</button></nav></header><main id="viewport" aria-label="可拖动与缩放的交互思维导图"><div id="world"><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div></div></main><div id="empty" role="status">没有匹配关键词 / No matches</div><div class="controls"><button id="out" aria-label="缩小">−</button><button id="in" aria-label="放大">＋</button></div><footer><span>虚线连接思路，保留尚未确定的关系。<br>拖动画布 · 滚轮缩放 · 点击关键词阅读</span><span>AFTER BABEL / A WORKING MAP<br>研究构想 · 非实证结论</span></footer><dialog id="detail"><button class="close" aria-label="关闭">×</button><div class="tag" id="tag"></div><h2 id="title"></h2><div class="english" id="en"></div><p id="zh"></p><p class="english" id="ex"></p></dialog><script>
const groups=[
['概念起点','Conceptual beginnings',520,365,[
['巴别塔','Language, separation and shared meaning','以巴别塔作为语言分化与共同理解的隐喻，追问不同主体如何共同建构意义。川美参考作品待获得原始资料后补充，不将其机制视为已知。','Babel frames the tension between linguistic difference and shared understanding. The Sichuan Fine Arts Institute reference remains unverified.'],
['文化记忆','Remembering through people and media','研究记忆如何经由讲述、记录与解释被传递。聚焦一个具体的双语或多语言社区，先使用非敏感、获许可的材料。','Study how a specific multilingual community transmits memory through telling, recording and interpretation, using permitted, non-sensitive material.'],
['时间连续性','Connecting past, present and future','作为可进一步发展的支线：人如何把碎片化经历组织成连续叙事。它不等同于主观时长估计，需要单独界定。','A possible secondary inquiry asks how fragmented experiences form a continuous narrative, distinct from judging elapsed time.'],
['关系网络','Map connections between fragments','用节点、联系与断裂理解记忆结构。现阶段采用关系网络表述，不声称已进行了数学拓扑分析。','Use nodes, connections and breaks to map memory relations without claiming a mathematical topological analysis.']]],
['记忆生态','People, infrastructures and flows',1260,360,[
['讲述与倾听','Memory holders and interpreters','讲述者、家人、听众、记录者与翻译者共同影响什么被留下，以及什么得到解释。需调查各自的权限与诉求。','Memory holders, listeners, recorders and translators shape what is retained. Investigate their different needs and permissions.'],
['档案与平台','Storage, access and institutional power','社区组织、档案机构、平台与维护者决定收集、访问、迁移和删除的条件。将来源、许可与版本信息纳入地图。','Community organisations, archives, platforms and maintainers govern collection, access, migration and deletion. Include provenance, permissions and versions.'],
['资源与流动','Trace stories, data, trust and authority','追踪语音、文本、影像、元数据、时间与信任；区分记忆、翻译、数据、反馈及权威的流向。','Trace audio, text, images, metadata, time and trust, distinguishing flows of memory, translation, data, feedback and authority.'],
['生态层次','From direct relations to wider systems','从直接互动、组织关系、平台环境、语言权力与代际变化分析系统；计算处理作为额外分析层。','Examine direct interaction, organisational relationships, platform conditions, language power and generational change, with computation as an additional layer.']]],
['潜在损失','Possible mechanisms to investigate',420,685,[
['语境流失','Meaning may shift in translation','调查翻译、转录与摘要是否遗漏重要背景、语气或文化含义。损失需要通过材料比较与参与者解释判断。','Investigate whether transcription, translation and summarisation omit context, tone or cultural meaning through comparison and participant interpretation.'],
['叙事趋同','Differences may become flattened','待验证假设：生成式摘要可能弱化分歧，使多种讲述趋于相似。需保留原始差异来检验，而非预设结论。','Hypothesis: generated summaries may flatten disagreement. Preserve source differences and test this possibility rather than assuming it.'],
['来源模糊','Evidence and inference become confused','档案碎片化或完整流畅的生成结果可能让读者难以区分原始证据、转译与推测。研究他们实际如何辨认。','Fragmentation and fluent generation may blur evidence, translation and inference. Study how readers actually distinguish them.'],
['解释权流失','Who can correct the record?','当参与者无法拒绝、修正或撤回系统叙事时，解释权可能受限。调查权限安排及实际使用中的障碍。','Interpretive control may be constrained when people cannot reject, revise or withdraw a narrative. Examine permissions and practical barriers.']]],
['再生交互','Proposed mechanisms for participation',1370,685,[
['来源追溯','Keep evidence within reach','让生成段落链接到原始片段，明确区分转录、翻译、摘要与新生成内容，方便参与者核查。','Link generated passages to source fragments and distinguish transcription, translation, summary and generation for verification.'],
['保留空缺','Make uncertainty visible','标记缺失与未经支持的细节；允许保持未知，不要求AI把每一处缺失补成完整故事。','Mark missing and unsupported details, allowing uncertainty to remain instead of completing every gap.'],
['协商反馈','Compare, revise, reject and revisit','参与者可以比较不同解释、修改或拒绝生成结果；系统保留版本与分歧，让反馈影响下一轮解释。','Participants compare interpretations, revise or reject outputs, and revisit versions. Preserve disagreement and carry feedback into later interpretation.'],
['具身体验','Make fragmentation tangible','探索声音、空间与圆润的交互媒介，使人感知记忆的缺失与关联。具体形式应支持核查、协商和维护。','Explore sound, space and tangible interaction to make memory relations perceptible while supporting verification, negotiation and maintenance.']]],
['研究方法','Questions, comparisons and evidence',580,1040,[
['系统调查','Ground the map in a real setting','通过访谈、观察与材料追踪，确认行动者、流动、权限和退化机制。将已核实关系、假设与设计提议分别记录。','Use interviews, observation and material tracing to establish actors, flows, permissions and mechanisms, distinguishing evidence, hypotheses and proposals.'],
['解释能动性','Can people judge and redirect AI?','核心问题：面对不完整或多语言资料，可协商的生成式交互如何影响人的理解、质疑、拒绝与修改能力？','Core question: how does negotiable AI interaction affect the ability to understand, question, reject and revise interpretations of incomplete or multilingual records?'],
['条件比较','Automatic versus negotiable reconstruction','比较自动重建与可协商重建。尽量保持材料、模型与任务一致；若同时改变多种功能，仅能归因于整体机制。','Compare automatic and negotiable reconstruction using matched material, model and task. Bundled feature changes support conclusions about the package, not individual features.'],
['行为与访谈','Observe verification and decision-making','记录来源查看、错误辨认、修改、接受与拒绝行为，结合访谈理解控制感与作者身份；控制感不等于实际判断能力。','Log source checks, error detection, revisions, acceptance and rejection, alongside interviews on control and authorship. Perceived control differs from demonstrated judgment.']]],
['发展路径','Coursework, prototype and research',1180,1040,[
['系统地图','Form and Method / 23 October','近期产出以系统分析为核心：清晰边界、行动者、资源、流动、潜在损失与可介入节点。此网页是研究构想的入口。','The immediate output centres on system boundaries, actors, resources, flows, possible losses and intervention points. This page is an entry into that inquiry.'],
['交互原型','From map to a focused intervention','先制作一个可验证的来源追溯与协商机制，再决定是否发展为空间装置。避免让所有概念同时成为研究变量。','Prototype a focused provenance and negotiation mechanism before deciding on a spatial installation; avoid treating every concept as a research variable.'],
['研究贡献','Generate knowledge beyond a prototype','RCA关注系统介入与体验；HCI研究需提出明确问题、方法与证据。创新点仍需通过文献检索建立。','RCA work addresses intervention and experience; HCI research needs a clear question, method and evidence. Novelty still requires a literature review.'],
['长期主线','Human agency in generative systems','以反馈驱动的生成式系统中的人类能动性为长期主题，将文化记忆作为具体情境；持续研究判断、作者身份与协商。','Develop human agency in feedback-driven generative systems as a longer-term agenda, with cultural memory as a situated context.']]]
];
const nodes=[{id:'root',x:900,y:660,zh:'After Babel',en:'协商碎片化记忆 · Negotiating fragmented memories',text:'巴别塔之后：探索多语言、不完整的文化记忆如何在人、档案、平台与生成式AI之间被记录、解释与维护。此图组织研究方向，尚不代表已经验证的系统因果关系。',ex:'Explore how multilingual, incomplete cultural memories are recorded, interpreted and maintained across people, archives, platforms and generative AI. This is a working research map, not a validated causal model.',kind:'center'}],edges=[];
groups.forEach((g,i)=>{const id='g'+i;nodes.push({id,x:g[2],y:g[3],zh:g[0],en:g[1],text:g[4].map(v=>v[0]+'：'+v[2]).join('\n\n'),ex:g[4].map(v=>v[1]+'. '+v[3]).join('\n\n'),kind:'group'});edges.push(['root',id]);g[4].forEach((v,j)=>{let x,y;if(i===0||i===1){x=g[2]+(j%2?120:-120);y=g[3]-(j<2?220:110)}else if(i===2||i===3){x=g[2]+(i===2?-220:220);y=g[3]-150+j*100}else{x=g[2]+(j%2?115:-115);y=g[3]+(j<2?110:220)}const nid=id+'n'+j;nodes.push({id:nid,x,y,zh:v[0],en:v[1],text:v[2],ex:v[3],kind:'leaf',parent:g[0]});edges.push([id,nid]);});});
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));const world=document.querySelector('#world'),viewport=document.querySelector('#viewport'),dialog=document.querySelector('dialog');
edges.forEach(([a,b],i)=>{a=byId[a];b=byId[b];const p=document.createElementNS('http://www.w3.org/2000/svg','path');const dx=b.x-a.x,dy=b.y-a.y,bend=(i%2?1:-1)*35;p.setAttribute('d',`M ${a.x} ${a.y} C ${a.x+dx*.32-dy*.12} ${a.y+dy*.12+bend}, ${b.x-dx*.35+dy*.08} ${b.y-dy*.1-bend}, ${b.x} ${b.y}`);document.querySelector('#lines').append(p)});
function show(n){document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));document.getElementById(n.id)?.classList.add('selected');document.querySelector('#tag').textContent=n.parent||'AFTER BABEL / WORKING RESEARCH';document.querySelector('#title').textContent=n.zh;document.querySelector('#en').textContent=n.en;document.querySelector('#zh').textContent=n.text;document.querySelector('#ex').textContent=n.ex;dialog.showModal()}
nodes.forEach(n=>{const b=document.createElement('button');b.className='node '+n.kind;b.id=n.id;b.style.left=n.x+'px';b.style.top=n.y+'px';const t=document.createElement('strong');t.textContent=n.zh;const s=document.createElement('span');s.textContent=n.en;b.append(t,s);b.onclick=()=>show(n);document.querySelector('#nodes').append(b)});
let scale=1,tx=0,ty=0;function render(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}function fit(){scale=Math.min((innerWidth-50)/1800,(innerHeight-180)/1320);tx=(innerWidth-1800*scale)/2;ty=115+(innerHeight-180-1320*scale)/2;render()}fit();addEventListener('resize',fit);function zoom(f,x=innerWidth/2,y=innerHeight/2){const next=Math.max(.2,Math.min(2.2,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;render()}viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,tx,ty};viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;render()}});viewport.addEventListener('pointerup',()=>drag=null);viewport.addEventListener('pointercancel',()=>drag=null);document.querySelector('#in').onclick=()=>zoom(1.25);document.querySelector('#out').onclick=()=>zoom(.8);document.querySelector('#reset').onclick=()=>{document.querySelector('#search').value='';search('');fit()};function search(q){q=q.toLowerCase().trim();let hits=0;nodes.forEach(n=>{const match=!q||[n.zh,n.en,n.text,n.ex].join(' ').toLowerCase().includes(q);document.getElementById(n.id).classList.toggle('dim',!match);if(match)hits++});document.querySelector('#empty').style.display=hits?'none':'block'}document.querySelector('#search').oninput=e=>search(e.target.value);document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});document.querySelector('#about').onclick=()=>show({zh:'关于这张地图',en:'A map of questions, not settled answers',text:'由中心向外阅读六组主题。每个中文关键词配有一行英文，点击查看双语解释。拖动画布或使用缩放按钮探索；搜索支持中英文。所有曲线虚线均表示研究思路的组织联系，不表示已证实的因果关系。潜在损失属于待检验假设，再生交互属于设计提议。',ex:'Read outward from the centre across six themes. Select a node for bilingual detail; pan, zoom or search in either language. Dashed curves organise ideas rather than assert causality. Possible losses are hypotheses; regenerative interactions are design proposals.'});
</script></body></html>
