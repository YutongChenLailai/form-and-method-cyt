<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Form and Method CYT</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#262626;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}header{position:fixed;z-index:4;top:0;left:0;right:0;padding:26px 34px;background:linear-gradient(#fff 75%,#ffffff00);display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:17px;font-weight:500;margin:0;letter-spacing:.03em}.eyebrow{font-size:10px;letter-spacing:.19em;color:#777;margin-bottom:8px}.subtitle{font-size:11px;color:#777;margin-top:7px}nav{display:flex;gap:8px;align-items:center}button,input{border:1px solid #e4e4e4;border-radius:24px;background:#fff;padding:10px 15px}button:hover{background:#f4f4f4}input{width:170px;outline:none}input:focus,button:focus-visible{outline:2px solid #666;outline-offset:3px}#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}#viewport:active{cursor:grabbing}#world{position:absolute;width:1800px;height:1320px;transform-origin:0 0}svg{position:absolute;inset:0;width:1800px;height:1320px;pointer-events:none}path{fill:none;stroke:#bdbdbd;stroke-width:1.2;stroke-dasharray:3 7;stroke-linecap:round}.node{position:absolute;transform:translate(-50%,-50%);width:174px;min-height:70px;border:1px solid #e5e5e5;border-radius:30px;padding:15px 18px;background:#fff;text-align:left;transition:opacity .2s,box-shadow .2s,border .2s}.node:hover{background:#fafafa;border-color:#aaa;box-shadow:0 6px 25px #00000008}.node strong{font-size:13px;font-weight:500;display:block}.node span{display:block;font-size:10px;line-height:1.5;color:#777;margin-top:5px}.node.group{width:192px;background:#f6f6f6;border-color:#dedede}.node.center{width:240px;padding:27px 25px;border-radius:48px;background:#292929;color:white;border:0}.node.center strong{font:26px Georgia,serif}.node.center span{color:#ccc;font-size:11px}.node.dim{opacity:.18}.node.selected{border-color:#444}footer{position:fixed;bottom:24px;left:34px;right:34px;display:flex;justify-content:space-between;pointer-events:none;color:#888;font-size:11px;line-height:1.8}.controls{position:fixed;bottom:60px;right:30px;display:flex;gap:6px}.controls button{width:40px;height:40px;padding:0}dialog{border:1px solid #e2e2e2;border-radius:30px;padding:34px;width:min(500px,calc(100% - 32px));max-height:85vh;color:#333;box-shadow:0 20px 100px #00000013}dialog::backdrop{background:#ffffffb8;backdrop-filter:blur(5px)}dialog h2{font-size:23px;font-weight:500;margin:24px 0 8px}dialog p{font-size:14px;line-height:1.95}dialog .english{color:#777;font-size:13px}dialog .close{float:right;padding:6px 12px}.tag{font-size:10px;letter-spacing:.1em;color:#888}#empty{display:none;position:fixed;top:110px;right:35px;background:white;padding:12px;border-radius:20px;color:#777}@media(max-width:650px){header{padding:20px;align-items:flex-start}h1{font-size:14px}nav{flex-wrap:wrap;justify-content:flex-end;max-width:160px}nav input{width:145px}nav button{padding:7px 10px;font-size:11px}.subtitle{max-width:185px;line-height:1.5}footer{left:20px;right:20px;font-size:10px}footer span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div><div class="eyebrow">CYT / RESEARCH ATLAS · 01</div><h1>Form and Method</h1><div class="subtitle">从跨尺度兴趣出发，逐步形成研究问题</div></div><nav aria-label="地图工具"><input id="search" aria-label="搜索中英文关键词" placeholder="搜索 / Find a thought"><button id="reset">全览 ↗</button><button id="about">阅读说明</button></nav></header><main id="viewport" aria-label="可拖动与缩放的交互思维导图"><div id="world"><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div></div></main><div id="empty" role="status">没有匹配关键词 / No matches</div><div class="controls"><button id="out" aria-label="缩小">−</button><button id="in" aria-label="放大">＋</button></div><footer><span>虚线连接思路，保留尚未确定的关系。<br>拖动画布 · 滚轮缩放 · 点击关键词阅读</span><span>FORM AND METHOD / AN OPEN INQUIRY<br>研究构想 · 非实证结论</span></footer><dialog id="detail"><button class="close" aria-label="关闭">×</button><div class="tag" id="tag"></div><h2 id="title"></h2><div class="english" id="en"></div><p id="zh"></p><p class="english" id="ex"></p></dialog><script>
const groups=[["社会与技术", "Starting points · social and technical", 520, 365, [["战争", "Conflict, destruction and order", "从战争带来的破坏、边界变化与秩序重组出发。暂不把战争归因为语言或民族差异。", "Begin with destruction, changing boundaries and the reorganisation of order. Do not assume linguistic or ethnic difference causes war."], ["种族与民族", "Identity, belonging and boundaries", "探索身份如何被命名、分类与划界。种族、民族与国籍需要区分，不将它们当作固定本质。", "Explore how identities are named, classified and bounded, distinguishing race, ethnicity and nationality."], ["数据库", "How worlds become structured data", "关注分类、存储、关联、删除与访问：数据库如何组织一个世界？它被破坏后，哪些关系仍然存在？", "How do classification, storage, links, deletion and access organise a world? Which relations survive disruption?"], ["巴别塔", "A reference for connection and separation", "作为共同建造、语言分化与理解限度的概念入口。川美作品的具体作者与机制仍待原始资料确认。", "A reference for collective construction, linguistic difference and the limits of understanding. Details of the Sichuan artwork remain unverified."]]], ["物质与经验", "Starting points · physical and experiential", 1260, 360, [["宇宙", "Scale, duration and human perspective", "从宇宙尺度追问存在、持续与消逝。此处保留哲学兴趣，不预设它必须成为作品的科学解释。", "Use cosmic scale to question existence, duration and disappearance, without treating it as a settled scientific explanation for an artwork."], ["粒子", "Parts, interactions and emergence", "思考个体单元怎样通过相互作用形成整体。若使用粒子视觉，需要说明它是模拟、材料实验还是隐喻。", "Explore how interacting units form wholes. Distinguish physical simulation, material experiment and visual metaphor."], ["拓扑学", "Continuity, connection and transformation", "关注连续变化中的关系与性质。它可以成为待研究的方法；节点连线本身不足以构成数学拓扑研究。", "Investigate relations and properties under continuous transformation. A node-link diagram alone is not mathematical topology."], ["时间感知", "Experienced duration and event order", "探索主观时长、事件顺序与变化体验；先区分这些对象，也区分心理时间与物理时间。", "Explore perceived duration, event order and experiences of change, distinguishing psychological from physical time."]]], ["跨尺度联系", "Possible bridges · not causal claims", 420, 685, [["边界", "What separates one thing from another?", "战争边界、身份分类、数据库分区与空间边界可能形成比较路径，但它们并不具有同一种机制。", "Political borders, identity categories, database partitions and spatial boundaries offer comparisons without sharing one mechanism."], ["连接与断裂", "What remains when links break?", "把语言沟通、数据关联、空间连通作为不同实例，比较连接如何形成、断开与重新组织。", "Compare how communication, data links and spatial connections form, break and reorganise across distinct settings."], ["尺度转换", "What changes when we zoom?", "从粒子到群体、从个体体验到宏观系统，追问哪些现象能被迁移比较，哪些不能直接类比。", "Ask what can be compared when moving from particles to groups or from individual experience to large systems, and where analogies fail."], ["持续与变化", "What persists through transformation?", "把“什么保持、什么改变”作为开放问题。它可以连接物质、数据与感知，尚不等于任何守恒定律。", "Ask what persists through change across matter, data and experience, without claiming a conservation law."]]], ["候选问题", "Questions before a project is chosen", 1370, 685, [["秩序如何形成", "How do local acts form a whole?", "候选方向：参与者的局部操作怎样形成或改变整体结构？可由粒子、数据库与集体行动的兴趣进入。", "Candidate: how do participants’ local actions form or alter a larger structure?"], ["断裂如何被感知", "How do people experience disconnection?", "候选方向：当连接、访问或交流被中断，人如何辨认变化、作出解释并采取行动？先选择具体情境再研究。", "Candidate: how do people recognise, interpret and respond to interrupted connections, access or communication?"], ["谁决定边界", "Who may define or change a boundary?", "候选方向：交互系统中的分类与连接权限如何影响人的选择？身份议题不能仅用抽象视觉替代实际调查。", "Candidate: how do permissions to classify and connect affect people’s choices? Abstract visuals cannot replace situated inquiry into identity."], ["时间如何被体验", "How does interaction shape experienced time?", "候选方向：同一过程在不同反馈、节奏或关系结构下，是否产生不同的时长与顺序体验？", "Candidate: do feedback, pacing or relational structure change experienced duration or event order?"]]], ["形式与方法", "Try small experiments before converging", 580, 1040, [["关系草图", "Map ideas without forcing agreement", "用虚线曲线连接关键词，记录每条联系的依据、疑问与类比边界。本地图是探索图，尚不是现实系统的因果模型。", "Connect keywords while recording the basis, questions and limits of each analogy. This atlas is exploratory, not a causal system model."], ["材料实验", "Break, join, translate and transform", "尝试纸张、声音、文字、数据或粒子的断裂与重组，观察哪些操作产生值得继续追问的体验。", "Experiment with breaks and recombination in paper, sound, text, data or particles, noticing experiences that merit further inquiry."], ["交互实验", "Let a participant change a relation", "让参与者连接、断开、分类或改变节奏。先明确他们能做什么，以及这些操作到底改变了什么。", "Let participants connect, disconnect, classify or change pacing. Specify their actions and what those actions actually change."], ["观察与反思", "Follow surprising responses", "通过观察、访谈与过程记录判断实验揭示了什么。根据证据修改方向，不把喜好直接当作研究发现。", "Use observation, interviews and process documentation to revise the direction. Preference alone is not a research finding."]]], ["逐步收束", "Choose a question after exploration", 1180, 1040, [["发现共同张力", "Find a tension worth pursuing", "比较实验中反复出现的疑问，例如边界与流动、局部与整体、稳定与变化。允许最终问题超出当前候选。", "Look for recurring tensions such as boundaries and flows, parts and wholes, or stability and change. New questions may emerge."], ["选择具体情境", "Locate an accessible situation", "再决定研究谁、什么系统、哪种行为与哪类材料。是否采用战争背景、AI或数据库，应由问题决定。", "Then choose people, a system, an activity and material. Let the question determine whether conflict, AI or databases belong."], ["确定研究问题", "Specify what can be investigated", "将兴趣转成一个有对象、有范围、能通过设计与观察推进的问题。暂不预设文化记忆、AI修复或档案为终点。", "Define a bounded question that design and observation can advance, without prescribing cultural memory, AI repair or archives as the outcome."], ["形成项目", "Develop form and method together", "依据探索形成作品、系统介入与研究论证。RCA表达和HCI问题可以逐步建立联系，不必在起点统一。", "Develop an artwork, situated intervention and research argument through exploration, connecting RCA practice and HCI inquiry as the project develops."]]]];
const nodes=[{id:'root',x:900,y:660,zh:'Form & Method',en:'从兴趣出发 · An inquiry across scales',text:'从战争、数据库、种族与民族、宇宙、粒子、拓扑学和时间感知出发，探索跨尺度的联系，再经由形式实验与调查逐步收束。当前没有预定的项目终点。',ex:'Begin with conflict, databases, race and ethnicity, the cosmos, particles, topology and perceived time. Explore connections, experiment and investigate before choosing a bounded project.',kind:'center'}],edges=[];
groups.forEach((g,i)=>{const id='g'+i;nodes.push({id,x:g[2],y:g[3],zh:g[0],en:g[1],text:g[4].map(v=>v[0]+'：'+v[2]).join('\n\n'),ex:g[4].map(v=>v[1]+'. '+v[3]).join('\n\n'),kind:'group'});edges.push(['root',id]);g[4].forEach((v,j)=>{let x,y;if(i===0||i===1){x=g[2]+(j%2?120:-120);y=g[3]-(j<2?220:110)}else if(i===2||i===3){x=g[2]+(i===2?-220:220);y=g[3]-150+j*100}else{x=g[2]+(j%2?115:-115);y=g[3]+(j<2?110:220)}const nid=id+'n'+j;nodes.push({id:nid,x,y,zh:v[0],en:v[1],text:v[2],ex:v[3],kind:'leaf',parent:g[0]});edges.push([id,nid]);});});
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));const world=document.querySelector('#world'),viewport=document.querySelector('#viewport'),dialog=document.querySelector('dialog');
edges.forEach(([a,b],i)=>{a=byId[a];b=byId[b];const p=document.createElementNS('http://www.w3.org/2000/svg','path');const dx=b.x-a.x,dy=b.y-a.y,bend=(i%2?1:-1)*35;p.setAttribute('d',`M ${a.x} ${a.y} C ${a.x+dx*.32-dy*.12} ${a.y+dy*.12+bend}, ${b.x-dx*.35+dy*.08} ${b.y-dy*.1-bend}, ${b.x} ${b.y}`);document.querySelector('#lines').append(p)});
function show(n){document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));document.getElementById(n.id)?.classList.add('selected');document.querySelector('#tag').textContent=n.parent||'FORM AND METHOD / OPEN INQUIRY';document.querySelector('#title').textContent=n.zh;document.querySelector('#en').textContent=n.en;document.querySelector('#zh').textContent=n.text;document.querySelector('#ex').textContent=n.ex;dialog.showModal()}
nodes.forEach(n=>{const b=document.createElement('button');b.className='node '+n.kind;b.id=n.id;b.style.left=n.x+'px';b.style.top=n.y+'px';const t=document.createElement('strong');t.textContent=n.zh;const s=document.createElement('span');s.textContent=n.en;b.append(t,s);b.onclick=()=>show(n);document.querySelector('#nodes').append(b)});
let scale=1,tx=0,ty=0;function render(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}function fit(){scale=Math.min((innerWidth-50)/1800,(innerHeight-180)/1320);tx=(innerWidth-1800*scale)/2;ty=115+(innerHeight-180-1320*scale)/2;render()}fit();addEventListener('resize',fit);function zoom(f,x=innerWidth/2,y=innerHeight/2){const next=Math.max(.2,Math.min(2.2,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;render()}viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,tx,ty};viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;render()}});viewport.addEventListener('pointerup',()=>drag=null);viewport.addEventListener('pointercancel',()=>drag=null);document.querySelector('#in').onclick=()=>zoom(1.25);document.querySelector('#out').onclick=()=>zoom(.8);document.querySelector('#reset').onclick=()=>{document.querySelector('#search').value='';search('');fit()};function search(q){q=q.toLowerCase().trim();let hits=0;nodes.forEach(n=>{const match=!q||[n.zh,n.en,n.text,n.ex].join(' ').toLowerCase().includes(q);document.getElementById(n.id).classList.toggle('dim',!match);if(match)hits++});document.querySelector('#empty').style.display=hits?'none':'block'}document.querySelector('#search').oninput=e=>search(e.target.value);document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});document.querySelector('#about').onclick=()=>show({zh:'关于这张地图',en:'A map of questions, not settled answers',text:'从两组初始兴趣，经跨尺度联系、候选问题与形式实验，走向逐步收束。每个中文关键词配有一行英文，点击查看双语解释。拖动画布或使用缩放按钮探索；搜索支持中英文。所有曲线虚线均表示研究思路的组织联系，不表示已证实的因果关系。候选问题尚未选定；共同张力与项目终点允许改变。',ex:'Read outward from the centre across six themes. Select a node for bilingual detail; pan, zoom or search in either language. Dashed curves organise ideas rather than assert causality. Candidate questions remain open; experiments will inform the eventual focus.'});
</script></body></html>
