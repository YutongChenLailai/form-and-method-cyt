ystem."],["memory",760,470,"Memory & Place Values","Keep testimony, image corrections, sources and contested meanings distinct from measured site evidence."],["siteevidence",1910,470,"Spatial Information","Measured plans, paths, seating, shade, entrances, observations and photographs."],["publicspace",760,1190,"Shared Space","Existing public resting space, facilities, access routes and patterns of use."],["capacity",1910,1190,"Funding & Maintenance","Budget, materials, installation capacity, approvals and long-term upkeep."],["technology",2440,820,"Versioned Spatial Model","Specify how observations update the model. Without repeated field updates, describe it as a spatial model rather than claiming a live digital twin."],["valueregister",1320,1630,"Value & Decision Register","Connect a memory claim to its place, interpretation, negotiated requirement, design version and review outcome."]],"e":[["resources","memory"],["resources","siteevidence"],["resources","publicspace"],["resources","capacity"],["resources","technology"],["resources","valueregister"]]},{"title":"Relationships & Flows","zh":"关系、流动与反馈回路","n":[["relationships",1320,820,"Spatial Value Translation","Trace memory → meaning → negotiated needs → requirements → parameters → implementation checks."],["collaboration",760,470,"Meaning → Negotiated Needs","Discuss which relationships should continue and how present needs differ across residents."],["memoryflow",1910,470,"Memory → Meaning","Residents explain why a place mattered; preserve sources and alternative accounts instead of inferring a single value."],["resourceflow",760,1190,"Parameters → Buildability Review","Architects and builders check materials, cost, skills, access, installation and maintenance."],["designflow",1910,1190,"Requirements → Design Options","Translate agreed needs into reviewable options; distinguish measurable constraints from values requiring discussion."],["feedbackloop",2440,820,"Prototype → Observed Use → Revision","Test a prototype, collect field observations and invite residents to correct both the design and its interpretation."],["dualfeedback",760,1640,"Memory Feedback & Design Feedback","“It was not like this” corrects an account; “I want this to change” expresses a future preference. Keep both linked but distinct."],["decisiontrace",1320,2050,"Traceable Decision Record","Record who proposed, interpreted, revised, accepted or rejected each requirement, with reasons and design versions."],["authority",1910,1640,"Disagreement & Decision Rights","Residents validate meaning; professionals assess feasibility; responsible bodies approve delivery. Preserve unresolved dissent."]],"e":[["relationships","collaboration"],["relationships","memoryflow"],["relationships","resourceflow"],["relationships","designflow"],["designflow","feedbackloop"],["memoryflow","dualfeedback"],["designflow","decisiontrace"],["feedbackloop","authority"]]},{"title":"Causal Factors","zh":"解释问题背后的因果因素","n":[["causes",1320,820,"Causal Factors","Explain why memory loss, restricted participation or spatial mismatch may occur; distinguish causes from symptoms."],["memorycauses",760,470,"Memory Loss","Relocation, generational change and undocumented everyday experience can weaken shared local memory."],["participationcauses",1910,470,"Participation Barriers","Meeting formats, language, mobility, time and digital access can limit whose views are heard."],["spatialcauses",760,1190,"Spatial Mismatch","Standardized proposals may miss differences in shade, rest, circulation and daily use."],["systemcauses",1910,1190,"Information Gaps","Fragmented records and unclear responsibility can break the path from feedback to design decisions."],["inferencegap",1320,1630,"Unexamined AI Inference","Hypothesis to test: an apparently clear AI summary may remove context or turn a contested value into an unsupported parameter."]],"e":[["causes","memorycauses"],["causes","participationcauses"],["causes","spatialcauses"],["causes","systemcauses"] const zhNotes={"boundary":"研究滨河新村一处共享空间如何在过去经验、当前使用和未来更新之间持续演变。","topic":"研究框架设想：居民共同解释场所曾经的意义，并协商它未来应如何改变。","site":"研究深圳滨河新村，聚焦一处有代表性的公共休憩空间。","spatialscope":"以前期AI记忆平台为基础，将新研究聚焦于居民经验如何转译成设计决策。","researchquestion":"AI介导的数字孪生反馈，如何将记忆、社会价值和未来需求转成可协商、可验证且可建造的设计决策？","coretension":"数字设计仍受材料、成本、工艺和现场条件限制；检验居民知识能否改变真实设计选择。","situatedbuildability":"记忆须经解释与协商，才能形成设计要求或建筑参数；不能把“过去热闹”直接换算成座椅数量。","humanfeedback":"居民修正解释，建筑师审查可行性；明确系统从这些纠正中具体学习什么。","digitalphysical":"追踪既有价值如何影响原型，以及实际使用观察如何反馈到下一轮设计。","actors":"识别知识贡献者、决策者、实施者及受影响者。","residents":"居民提供记忆、定义优先事项、纠正AI解释，并检查方案是否延续重要的空间关系。","families":"在居民同意参与时补充支持需求与观察。","community":"组织居民、传达社区优先事项并支持参与。","designteam":"将需求转成方案、记录决策并评估可行性。","publicsector":"明确审批、预算、场地使用和维护责任，记录谁有权批准空间改变。","resources":"识别系统可用的知识、场所、基础设施、资金和技术能力。","memory":"保存口述、图像纠正、来源和有争议的意义，并与现场测量证据区分。","siteevidence":"测绘图、路径、座椅、遮阴、入口、观察记录和照片。","publicspace":"现有公共休憩空间、设施、通行路线及使用规律。","capacity":"预算、材料、施工能力、审批和长期维护。","technology":"明确现场观察如何更新模型；若没有持续的现场反馈，先称为空间模型，不声称已实现实时数字孪生。","relationships":"追踪记忆→空间意义→当前需求协商→设计要求→建筑参数→实施核查。","collaboration":"协商哪些空间关系需要延续，以及不同居民当前需求如何不同。","memoryflow":"居民解释场所为何重要，保留来源与不同叙述，不自动推断单一价值。","resourceflow":"由建筑师与施工维护人员核查材料、成本、技能、通行、安装和维护条件。","designflow":"把协商后的需求转成可审阅方案，区分可测量约束与须经讨论的价值。","feedbackloop":"测试原型、收集实际观察，并让居民纠正设计及其解释。","causes":"解释记忆流失、参与受限或空间不匹配的原因，并区分原因与表象。","memorycauses":"搬迁、代际变化和日常经验未被记录，可能削弱社区共同记忆。","participationcauses":"会议形式、语言、行动能力、时间和数字设备门槛会限制意见表达。","spatialcauses":"标准化方案可能忽略遮阴、休息、通行和日常使用差异。","systemcauses":"记录分散、责任不清，可能切断反馈到设计决策的路径。","degeneration":"标明已有证据支持的退化现象，以及仍需调查的风险。","memorydeg":"核查转译中是否丢失记忆来源、不确定性或社会意义；这仍是待调查风险。","participationdeg":"核查谁的叙述被遗漏，以及分歧是否被误写为共识。","spatialdeg":"核查数字方案是否依赖未经验证的材料、预算、安装或维护假设。","governance":"核查居民能否看见反馈如何改变决策，或建议未被采用的原因。","interventions":"选择能够增强居民主体性、共享知识和长期照护的介入点。","memorytool":"在取得同意、标明来源并允许居民纠正的前提下，用AI整理口述和照片。","participationtool":"提供VR及同等的非VR方式，让居民比较空间方案并反馈意见。","designmethod":"居民先核对意义与要求，再由建筑师评估并调整相应设计选项。","impact":"评估可核查的设计影响、社会价值延续、舒适与通行，以及持续参与；不预设已经改善。","safeguards":"为居民保留纠正和异议渠道，明确
