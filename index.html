let physics=false;function relax(){if(physics)return;physics=true;let step=0;function tick(){let moving=false;for(const n of nodes){n.vx=(n.vx||0)*.72;n.vy=(n.vy||0)*.72}for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j];const ae=document.querySelector(`[data-id="${a.id}"]`),be=document.querySelector(`[data-id="${b.id}"]`);if(!ae||!be)continue;let ax=a.x,ay=a.y,aw=ae.offsetWidth,ah=ae.offsetHeight,bx=b.x,by=b.y,bw=be.offsetWidth,bh=be.offsetHeight;let ox=(aw+bw)/2+28-Math.abs((ax+aw/2)-(bx+bw/2)),oy=(ah+bh)/2+24-Math.abs((ay+ah/2)-(by+bh/2));if(ox<=0||oy<=0)continue;let activeA=a.id===draggingId,activeB=b.id===draggingId;let sx=Math.sign((ax+aw/2)-(bx+bw/2))|| (i%2?1:-1),sy=Math.sign((ay+ah/2)-(by+bh/2))|| (j%2?1:-1);if(ox<oy){let force=(ox+1)*.16;if(!activeA)a.vx=(a.vx||0)+sx*force*(activeB?2:1);if(!activeB)b.vx=(b.vx||0)-sx*force*(activeA?2:1)}else{let force=(oy+1)*.16;if(!activeA)a.vy=(a.vy||0)+sy*force*(activeB?2:1);if(!activeB)b.vy=(b.vy||0)-sy*force*(activeA?2:1)}}for(let i=0;i<edges.length;i++)for(let j=i+1;j<edges.length;j++){let a=edges[i],b=edges[j];let pa=document.querySelector('[data-edge="'+i+'"]'),pb=document.querySelector('[data-edge="'+j+'"]');if(!pa||!pb)continue;let best=99,sg=1;for(let t=.2;t<.9;t+=.16)for(let u=.2;u<.9;u+=.16){let p=pa.getPointAtLength(pa.getTotalLength()*t),q=pb.getPointAtLength(pb.getTotalLength()*u),d=Math.hypot(p.x-q.x,p.y-q.y);if(d<best){best=d;let g=geometry(a);sg=Math.sign((p.x-q.x)*(-g.dy)+(p.y-q.y)*g.dx)||((i+j)%2?1:-1)}}if(best<30){let f=(30-best)*.038;a.bendV=(a.bendV||0)+sg*f;b.bendV=(b.bendV||0)-sg*f}}for(const e of edges){e.bendV=(e.bendV||0)*.72;if(Math.abs(e.bendV)>.04)moving=true;e.bend=(e.bend||0)+(e.bendV||0)}for(const n of nodes){if(n.id===draggingId)continue;let vx=n.vx||0,vy=n.vy||0;if(Math.abs(vx)+Math.abs(vy)>.08)moving=true;n.x+=vx;n.y+=vy;let el=document.querySelector(`[data-id="${n.id}"]`);if(el){el.style.left=n.x+'px';el.style.top=n.y+'px'}}lines();step++;if(movi
